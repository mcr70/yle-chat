<div class="history-list-container">
  
  <div class="discussions-header">
      
    <h3>Omat keskustelut</h3>

    <button 
        *ngIf="isLoggedIn$ | async" 
        (click)="refreshDiscussions()" 
        [disabled]="isLoading$ | async"
        class="refresh-button"
        title="{{ (isLoading$ | async) ? 'Ladataan...' : 'Päivitä keskustelut' }}">
        
        <span *ngIf="!(isLoading$ | async)">🔄</span> 
        <span *ngIf="isLoading$ | async" class="spinner">🔄</span> 
    </button>
  </div>

  
  <ng-container *ngIf="isLoggedIn$ | async; else notLoggedIn">      
    <ng-container *ngIf="(myDiscussions$ | async) as discussions">
        
      <p *ngIf="!discussions.length && !(isLoading$ | async)">Ei kommentoitua historiaa.</p>

      <ul class="history-list">
        <li *ngFor="let item of discussions | slice:0:displayLimit">
          <div class="list-item-header"> 
              
              <a href="#" 
                 (click)="selectDiscussion(item); $event.preventDefault()" 
                 title="{{ item.articleTitle }}"
                 [class.truncated-title]="true"                     
                 class="article-title-link">                        
                {{ item.articleTitle }} </a>
          </div>

          <p class="comment-preview">
            <span class="comment-count">
              {{ item.commentCount }} kommentti{{ item.commentCount > 1 ? 'a' : '' }}
            </span>
          </p>
        </li>
      </ul>

      <button *ngIf="discussions.length > displayLimit" 
          (click)="displayLimit = displayLimit + 5" 
          class="load-more-button">
        Näytä lisää
      </button>
    </ng-container>
  </ng-container>
  
  <ng-template #notLoggedIn>
      <p class="login-prompt">Kirjaudu sisään osallistuaksesi keskusteluihin</p>
  </ng-template>

</div>
