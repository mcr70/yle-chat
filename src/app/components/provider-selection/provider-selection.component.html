<app-toolbar 
  [title]="'ARTICLES.TITLE' | translate" 
  [showHomeButton]="false"
  [showMenuToggle]="false">
</app-toolbar>

<div class="main-layout">
  <div class="selection-card">
    <p class="subtitle">{{ 'PROVIDERS.SELECT_PROMPT' | translate }}</p>

    <div class="provider-grid">
      <div 
        *ngFor="let provider of providers" 
        class="provider-item"
        (click)="selectProvider(provider.id)">
        
        <div class="provider-header">
          <h2>{{ provider.name }}</h2>
          <span class="badge" [ngClass]="provider.badgeClass">
            {{ provider.badgeTextKey | translate }}
          </span>
        </div>

        <p class="description">{{ provider.descriptionKey | translate }}</p>
      </div>
    </div>
  </div>
</div>
