<header class="main-toolbar">
  <div class="toolbar-left">
    <button 
      *ngIf="showHomeButton" 
      class="yle-button home-btn" 
      (click)="goHome()" 
      [attr.title]="'TOOLBAR.HOME' | translate">
      <svg class="home-icon" viewBox="0 0 24 24" width="24" height="24">
        <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>

    <button 
      *ngIf="showMenuToggle" 
      class="menu-toggle-btn" 
      (click)="toggleMenu.emit()">
      ☰
    </button>

    <h1 class="app-title" *ngIf="title">{{ title }}</h1>
  </div>

  <div class="toolbar-right">
    <button class="yle-button refresh-button" (click)="onRefresh()" [disabled]="isRefreshing" [attr.title]="'TOOLBAR.REFRESH' | translate">
      @if (!isRefreshing) {
        <span>🔄</span>
      } @else {
        <app-spinner [show]="isRefreshing"></app-spinner>
      }
    </button>

    <button class="yle-button info-btn" (click)="openInfoModal()" [attr.title]="'TOOLBAR.INFO' | translate">
      ℹ️
    </button>
    <div class="preferences-container">
      <button
        class="yle-button preferences-btn"
        type="button"
        (click)="togglePreferences()"
        [attr.aria-expanded]="isPreferencesOpen"
        [attr.title]="'PREFERENCES.BUTTON' | translate">
        ⚙️
      </button>

      <div class="preferences-menu" *ngIf="isPreferencesOpen">
        <h2>{{ 'PREFERENCES.TITLE' | translate }}</h2>
        <app-language-selector (languageSelected)="closePreferences()"></app-language-selector>
      </div>
    </div>
    <app-login-panel *ngIf="showLoginButton" [provider]="provider"></app-login-panel>
  </div>

</header>

<!-- Info Modal suoraan Toolbarin sisällä -->
<div class="modal-overlay" *ngIf="isInfoModalOpen" (click)="closeInfoModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>{{ 'INFO.TITLE' | translate }}</h2>
      <button class="close-btn" (click)="closeInfoModal()">&times;</button>
    </header>

    <div class="modal-body">
      <section>
        <p>
          {{ 'INFO.PROVIDER_DESCRIPTION' | translate }}
        </p>
      </section>

      <section>
        <h3>{{ 'INFO.STORAGE_TITLE' | translate }}</h3>
        <p>{{ 'INFO.STORAGE_DESCRIPTION' | translate }}</p>
      </section>

      <section>
        <h3>{{ 'INFO.AUTH_TITLE' | translate }}</h3>
        <p>
          {{ 'INFO.AUTH_DESCRIPTION' | translate }}
        </p>
      </section>
    </div>

    <footer class="modal-footer">
      <button class="yle-button" (click)="closeInfoModal()">{{ 'COMMON.DONE' | translate }}</button>
    </footer>
  </div>
</div>
